version: 2
updates:
  # Librerías de Flutter (pubspec.yaml)
  - package-ecosystem: pub
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Acciones usadas en los workflows de GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
