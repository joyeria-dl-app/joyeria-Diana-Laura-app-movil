# PUBLICAR APK
# Tipo: entrega continua (CD) · Alcance: la versión que se publica en GitHub Releases.
# Compila el APK de producción y lo adjunta a la versión.
#
# Ejecución: EN SECUENCIA. Primero corren las pruebas de regresión completas (reutiliza el
# workflow pruebas-regresion.yml); el APK solo se compila si todas pasan (`needs: regresion`).
#
# Acción según el resultado: si la regresión falla, este workflow se detiene, la versión queda
# sin APK y "Avisar fallas" abre una issue. Una versión con pruebas en rojo no se publica.
#
# Versión: la etiqueta (por ejemplo v0.3.0) debe coincidir con `version:` de pubspec.yaml
# (0.3.0+3: versionName 0.3.0 y versionCode 3). Si no coinciden, no se compila. El APK se
# compila con esa versión y se nombra joyeria-diana-laura-v0.3.0+3.apk. Esquema completo en
# docs/despliegue_google_play.md.
name: Publicar APK

on:
  # Al publicar una versión en GitHub (Releases → Publish release).
  release:
    types: [published]
  # Permite compilar el APK de una versión ya publicada.
  workflow_dispatch:
    inputs:
      tag:
        description: Etiqueta de la versión (por ejemplo v0.1.0)
        required: true

# Necesario para adjuntar el APK a la versión.
permissions:
  contents: write

jobs:
  # 1. Regresión completa: unitarias, pruebas de la versión anterior e integración en emulador.
  regresion:
    name: Regresión antes de publicar
    uses: ./.github/workflows/pruebas-regresion.yml
    secrets:
      FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
      PRUEBAS_CORREO: ${{ secrets.PRUEBAS_CORREO }}
      PRUEBAS_CONTRASENA: ${{ secrets.PRUEBAS_CONTRASENA }}
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

  # 2. Solo si la regresión pasó.
  compilar-apk:
    name: Compilar y adjuntar APK
    needs: regresion
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      # Se compila exactamente el código de la etiqueta de la versión.
      - name: Descargar el código de la versión
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      # Lee la versión de pubspec.yaml y detiene la publicación si no coincide con la etiqueta.
      - name: Revisar la versión
        id: version
        run: |
          linea=$(grep -E '^version:' pubspec.yaml | sed 's/version: *//')
          nombre=${linea%%+*}
          codigo=${linea##*+}
          echo "Etiqueta: $TAG · pubspec.yaml: $linea (versionName $nombre, versionCode $codigo)"
          if [ "v$nombre" != "$TAG" ]; then
            echo "::error::La etiqueta $TAG no coincide con la versión $nombre de pubspec.yaml"
            exit 1
          fi
          echo "nombre=$nombre" >> "$GITHUB_OUTPUT"
          echo "codigo=$codigo" >> "$GITHUB_OUTPUT"
          echo "## Versión publicada" >> $GITHUB_STEP_SUMMARY
          echo "- versionName: $nombre (etiqueta $TAG)" >> $GITHUB_STEP_SUMMARY
          echo "- versionCode: $codigo" >> $GITHUB_STEP_SUMMARY

      - name: Instalar Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      # google-services.json (Firebase Cloud Messaging, #55) no se sube al repositorio porque el
      # repositorio es público; Gradle lo necesita para compilar y aquí se crea desde un secreto.
      - name: Crear google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      # La clave pública de Firebase se guarda como secreto del repositorio, no en el código.
      - name: Crear env.json
        run: echo '{"FIREBASE_API_KEY":"${{ secrets.FIREBASE_API_KEY }}"}' > env.json

      # Compila con el versionName y versionCode de pubspec.yaml ya revisados.
      - name: Compilar APK
        run: flutter build apk --release --dart-define-from-file=env.json --build-name=${{ steps.version.outputs.nombre }} --build-number=${{ steps.version.outputs.codigo }}

      # El APK se sube a la página de la versión con el nombre joyeria-diana-laura-vX.Y.Z+N.apk.
      - name: Adjuntar el APK a la versión
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVO: joyeria-diana-laura-${{ env.TAG }}+${{ steps.version.outputs.codigo }}.apk
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "$ARCHIVO"
          gh release upload "$TAG" "$ARCHIVO" --clobber
