# PRUEBAS DE ESFUERZO: carga creciente sobre el backend que usa la app.
# Genera tráfico real en el servidor de Render, por eso no corre en cada cambio:
# se lanza a mano, una vez por semana y al publicar una etiqueta de versión (v0.3.0, v1.0.0…).
name: Pruebas de esfuerzo

on:
  push:
    tags: ['v*']
  schedule:
    - cron: '0 15 * * 3' # miércoles 9:00 (hora de México)
  workflow_dispatch:
    inputs:
      usuarios:
        description: Usuarios simultáneos al punto máximo
        default: '50'

jobs:
  esfuerzo:
    name: Esfuerzo del backend con k6
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar k6
        uses: grafana/setup-k6-action@v1

      - name: Ejecutar prueba de esfuerzo
        uses: grafana/run-k6-action@v1
        env:
          # Con la etiqueta no hay entrada manual; el script usa 50 usuarios.
          USUARIOS: ${{ inputs.usuarios }}
        with:
          path: pruebas/esfuerzo/catalogo.js
