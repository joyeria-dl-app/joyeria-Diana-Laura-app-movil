# PRUEBAS DE ESFUERZO
# Tipo: esfuerzo · Alcance: el backend que usa la app (catálogo, carrito y pedidos con sesión)
# bajo carga creciente, con k6.
# Genera tráfico real en el servidor de Render, por eso no corre en cada cambio: se lanza a mano
# o al publicar una etiqueta de versión (v0.3.0, v1.0.0…). Antes de correrla hay que subir el
# límite por IP del backend en Render (RASP_RATE_LIMIT_MAX); ver pruebas/esfuerzo_sprint3.md.
#
# Ejecución: los usuarios virtuales de k6 hacen sus peticiones EN PARALELO (ese es el esfuerzo);
# los pasos del workflow van EN SECUENCIA.
#
# Acción según el resultado: en el escenario criterio (el que corre con cada versión), k6 falla
# si el 95 % de las respuestas pasa de 2 s o hay más de 1 % de errores; entonces "Avisar fallas"
# abre una issue. El escenario quiebre no tiene umbrales: busca hasta dónde llega el servidor.
name: Pruebas de esfuerzo

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      escenario:
        description: criterio (50 usuarios con umbrales) o quiebre (subida por escalones)
        type: choice
        options: [criterio, quiebre]
        default: criterio
      usuarios:
        description: Usuarios simultáneos del escenario criterio
        default: '50'
      maximo:
        description: Usuarios al último escalón del escenario quiebre
        default: '150'

jobs:
  esfuerzo:
    name: Esfuerzo del backend con k6
    runs-on: ubuntu-24.04
    steps:
      # Descarga el código del commit que disparó el workflow.
      - name: Descargar el código
        uses: actions/checkout@v7

      # k6 es la herramienta de pruebas de carga de Grafana.
      - name: Instalar k6
        uses: grafana/setup-k6-action@v1

      # pruebas/esfuerzo/catalogo.js define los escenarios y los umbrales.
      - name: Ejecutar prueba de esfuerzo
        uses: grafana/run-k6-action@v1
        env:
          # Con la etiqueta no hay entrada manual; el script usa el escenario criterio con 50 usuarios.
          ESCENARIO: ${{ inputs.escenario }}
          USUARIOS: ${{ inputs.usuarios }}
          MAXIMO: ${{ inputs.maximo }}
          # Cuenta de prueba para el carrito y los pedidos con sesión.
          PRUEBAS_CORREO: ${{ secrets.PRUEBAS_CORREO }}
          PRUEBAS_CONTRASENA: ${{ secrets.PRUEBAS_CONTRASENA }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        with:
          path: pruebas/esfuerzo/catalogo.js
