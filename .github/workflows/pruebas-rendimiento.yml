# PRUEBAS DE RENDIMIENTO
# Tipo: rendimiento · Alcance: tamaño del APK de producción (límite 30 MB) y tiempos de carga
# y scroll del catálogo en el emulador contra el backend de Render.
#
# Ejecución: los dos trabajos (tamaño y tiempos) corren EN PARALELO porque no dependen uno del
# otro; los pasos de cada trabajo van EN SECUENCIA. Este workflow corre EN PARALELO con
# Integración, Aceptación y Entorno.
#
# Acción según el resultado: si el APK pasa de 30 MB o los tiempos superan su límite, el
# workflow falla y "Avisar fallas" abre una issue.
name: Pruebas de rendimiento

on:
  workflow_dispatch:
  push:
    branches: [develop]
    tags: ['v*']

jobs:
  # Trabajo 1: tamaño del APK (no necesita emulador).
  tamano:
    name: Tamaño del APK de producción
    runs-on: ubuntu-24.04
    steps:
      # Descarga el código del commit que disparó el workflow.
      - name: Descargar el código
        uses: actions/checkout@v7

      # Misma versión de Flutter en todos los workflows para que los resultados sean comparables.
      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      # Librerías de pubspec.yaml.
      - name: Instalar dependencias
        run: flutter pub get

      # google-services.json (Firebase Cloud Messaging, #55) no se sube al repositorio porque el
      # repositorio es público; Gradle lo necesita para compilar y aquí se crea desde un secreto.
      - name: Crear google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      # El emulador y la compilación de Android necesitan Java 17.
      - name: Instalar Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # APK de producción para arm64 (la arquitectura de los teléfonos reales).
      - name: Compilar y analizar tamaño
        run: flutter build apk --release --target-platform android-arm64 --analyze-size

      # Falla si el APK pesa 30 MB o más; el tamaño queda en el resumen de la corrida.
      - name: Revisar límite de 30 MB
        run: |
          tamano=$(stat -c%s build/app/outputs/flutter-apk/app-release.apk)
          mb=$((tamano / 1024 / 1024))
          echo "## Rendimiento" >> $GITHUB_STEP_SUMMARY
          echo "Tamaño del APK (arm64): $mb MB" >> $GITHUB_STEP_SUMMARY
          mkdir -p resultados
          echo "{\"apk_mb\": $(awk "BEGIN{printf \"%.1f\", $tamano/1048576}")}" > resultados/metricas-tamano.json
          test $mb -lt 30

      # El tamaño medido se guarda para compararlo con la línea base (#230).
      - name: Guardar evidencia
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rendimiento-tamano
          path: resultados/
          if-no-files-found: ignore

  # Trabajo 2: tiempos en el emulador; corre al mismo tiempo que el trabajo 1.
  tiempos:
    name: Tiempos de carga y scroll
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      # Descarga el código del commit que disparó el workflow.
      - name: Descargar el código
        uses: actions/checkout@v7

      # Misma versión de Flutter en todos los workflows para que los resultados sean comparables.
      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      # Librerías de pubspec.yaml.
      - name: Instalar dependencias
        run: flutter pub get

      # google-services.json (Firebase Cloud Messaging, #55) no se sube al repositorio porque el
      # repositorio es público; Gradle lo necesita para compilar y aquí se crea desde un secreto.
      - name: Crear google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      # El emulador y la compilación de Android necesitan Java 17.
      - name: Instalar Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # Permite al emulador usar la aceleración por hardware del runner.
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # rendimiento_test.dart mide la carga del catálogo y el scroll; falla si pasan su límite.
      - name: Medir tiempos en el emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: flutter test integration_test/rendimiento_test.dart --reporter expanded --file-reporter json:resultados/rendimiento.json

      # Los tiempos quedan en el reporte JSON (líneas "RENDIMIENTO clave: valor") (#230).
      - name: Guardar evidencia
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rendimiento-tiempos
          path: resultados/
          if-no-files-found: ignore

  # Trabajo 3: junta lo medido por los dos trabajos y lo compara con la línea base guardada en
  # pruebas/rendimiento/linea_base.json (#230). Corre aunque alguno falle, para conservar los datos.
  comparar:
    name: Comparar con la línea base
    needs: [tamano, tiempos]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Descargar las mediciones
        uses: actions/download-artifact@v8
        with:
          pattern: rendimiento-*
          path: mediciones

      - name: Comparar con la línea base
        run: python3 pruebas/rendimiento/comparar.py mediciones metricas.json

      - name: Guardar evidencia
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rendimiento-comparacion
          path: metricas.json
          if-no-files-found: ignore
