# PRUEBAS DE ACEPTACIÓN
# Tipo: aceptación · Alcance: criterios de aceptación de las HU probados en la app real contra
# el backend de Render (HU-11: comprar, apartar y ver el estado del pedido).
# Las aceptaciones que necesitan a una persona (pago en Mercado Pago de HU-12, respuesta de la
# tienda en HU-13) se corren a mano; ver pruebas/aceptacion_hu12.md y aceptacion_hu13.md.
#
# Ejecución: los pasos van EN SECUENCIA y las pruebas corren EN SECUENCIA dentro del mismo
# emulador. Este workflow corre EN PARALELO con Integración, Entorno y Rendimiento.
#
# Acción según el resultado: en develop, si falla, "Avisar fallas" abre una issue; en el PR de
# develop a main es un check obligatorio y bloquea el paso a main.
name: Pruebas de aceptación

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  aceptacion:
    name: Aceptación en emulador Android
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      # Descarga el código del commit que disparó el workflow.
      - name: Descargar el código
        uses: actions/checkout@v7

      # Misma versión de Flutter en todos los workflows para que los resultados sean comparables.
      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      # Librerías de pubspec.yaml.
      - name: Instalar dependencias
        run: flutter pub get

      # El emulador y la compilación de Android necesitan Java 17.
      - name: Instalar Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # Permite al emulador usar la aceleración por hardware del runner.
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # La clave de Firebase viene de los secretos del repositorio. Este pipeline usa su propia
      # cuenta de cliente de prueba (ACEPTACION_CORREO): integración, aceptación y entorno corren al
      # mismo tiempo y, con una sola cuenta, se cambiaban el carrito entre ellos (#185).
      - name: Preparar la configuración de la app
        run: echo '{"FIREBASE_API_KEY":"${{ secrets.FIREBASE_API_KEY }}","PRUEBAS_CORREO":"${{ secrets.ACEPTACION_CORREO }}","PRUEBAS_CONTRASENA":"${{ secrets.ACEPTACION_CONTRASENA }}"}' > env.json

      # Levanta un Pixel 6 con Android 14 (API 34) sin animaciones y corre las pruebas en él.
      - name: Ejecutar pruebas de aceptación en el emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: flutter test integration_test/aceptacion_test.dart integration_test/aceptacion_pedidos_test.dart --dart-define-from-file=env.json --reporter expanded
