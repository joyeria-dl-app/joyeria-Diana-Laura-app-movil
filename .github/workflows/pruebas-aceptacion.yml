# PRUEBAS DE ACEPTACIÓN: los criterios de aceptación de cada historia de usuario, probados
# en la app real (emulador Android) contra el backend de Render.
# Corre cada vez que se une una tarea a develop (para detectar fallas el mismo día) y
# otra vez al pedir unir develop a main; si falla, no se puede pasar a main.
name: Pruebas de aceptación

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  aceptacion:
    name: Aceptación en emulador Android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Instalar Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # Permite al emulador usar la aceleración por hardware del runner.
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # La clave de Firebase y la cuenta de cliente de prueba vienen de los secretos del repositorio.
      - name: Preparar la configuración de la app
        run: echo '{"FIREBASE_API_KEY":"${{ secrets.FIREBASE_API_KEY }}","PRUEBAS_CORREO":"${{ secrets.PRUEBAS_CORREO }}","PRUEBAS_CONTRASENA":"${{ secrets.PRUEBAS_CONTRASENA }}"}' > env.json

      - name: Ejecutar pruebas de aceptación en el emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: flutter test integration_test/aceptacion_test.dart --dart-define-from-file=env.json --reporter expanded
