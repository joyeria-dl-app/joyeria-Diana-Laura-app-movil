# PRUEBAS DE ACEPTACIÓN
# Tipo: aceptación · Alcance: criterios de aceptación de las HU probados en la app real contra
# el backend de Render (HU-11: comprar, apartar y ver el estado del pedido).
# Las aceptaciones que necesitan a una persona (pago en Mercado Pago de HU-12, respuesta de la
# tienda en HU-13) se corren a mano; ver pruebas/aceptacion_hu12.md y aceptacion_hu13.md.
#
# Ejecución: los pasos van EN SECUENCIA y las pruebas corren EN SECUENCIA dentro del mismo
# emulador. Este workflow corre EN PARALELO con Integración, Entorno y Rendimiento.
#
# Acción según el resultado: en develop, si falla, "Avisar fallas" abre una issue; en el PR de
# develop a main es un check obligatorio y bloquea el paso a main.
name: Pruebas de aceptación

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # La aceptación solo corre si el código ya pasó las pruebas unitarias y el análisis estático en
  # esta misma corrida (#230): si alguno falla, no se gasta tiempo en el emulador.
  unitarias:
    name: Antes - pruebas unitarias
    uses: ./.github/workflows/pruebas-unitarias.yml

  analisis:
    name: Antes - análisis estático
    uses: ./.github/workflows/analisis-estatico.yml

  aceptacion:
    name: Aceptación en emulador Android
    # Una sola corrida a la vez por cuenta de prueba (ACEPTACION_CORREO), en todo el repositorio (#238): si otra
    # corrida ya la usa, esta espera a que termine en lugar de cambiarle el carrito a la mitad.
    concurrency:
      group: cuenta-aceptacion
      cancel-in-progress: false
    needs: [unitarias, analisis]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      # Descarga el código del commit que disparó el workflow.
      - name: Descargar el código
        uses: actions/checkout@v7

      # Misma versión de Flutter en todos los workflows para que los resultados sean comparables.
      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      # Librerías de pubspec.yaml.
      - name: Instalar dependencias
        run: flutter pub get

      # google-services.json (Firebase Cloud Messaging, #55) no se sube al repositorio porque el
      # repositorio es público; Gradle lo necesita para compilar y aquí se crea desde un secreto.
      - name: Crear google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      # El emulador y la compilación de Android necesitan Java 17.
      - name: Instalar Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # Permite al emulador usar la aceleración por hardware del runner.
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # La clave de Firebase viene de los secretos del repositorio. Este pipeline usa su propia
      # cuenta de cliente de prueba (ACEPTACION_CORREO): integración, aceptación y entorno corren al
      # mismo tiempo y, con una sola cuenta, se cambiaban el carrito entre ellos (#185).
      - name: Preparar la configuración de la app
        run: echo '{"FIREBASE_API_KEY":"${{ secrets.FIREBASE_API_KEY }}","PRUEBAS_CORREO":"${{ secrets.ACEPTACION_CORREO }}","PRUEBAS_CONTRASENA":"${{ secrets.ACEPTACION_CONTRASENA }}"}' > env.json

      # Levanta un Pixel 6 con Android 14 (API 34) sin animaciones y corre las pruebas en él.
      - name: Ejecutar pruebas de aceptación en el emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: flutter test integration_test/aceptacion_test.dart integration_test/aceptacion_pedidos_test.dart --dart-define-from-file=env.json --reporter expanded --file-reporter json:resultados/aceptacion.json

      # Resultado de cada criterio de aceptación en JSON, descargable desde la corrida (#230).
      - name: Guardar evidencia
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: resultados-aceptacion
          path: resultados/
          if-no-files-found: ignore
