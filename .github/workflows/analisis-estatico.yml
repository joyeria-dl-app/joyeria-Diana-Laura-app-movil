# ANÁLISIS DE CÓDIGO ESTÁTICO
# Tipo: análisis estático · Alcance: todo el código (lib, test, integration_test), el historial
# de Git y las dependencias de pubspec.yaml.
# Revisa el código sin ejecutarlo: reglas de calidad, formato, claves expuestas y dependencias.
#
# Ejecución: los pasos van EN SECUENCIA. gitleaks corre primero: si encuentra una clave, el
# workflow se detiene. Este workflow corre EN PARALELO con Flutter CI y Pruebas unitarias.
#
# Acción según el resultado: es un check obligatorio en los PR; si falla, no se puede unir. El
# resumen muestra el resultado real de cada revisión (pasó o falló).
name: Análisis de código estático

on:
  # En cada PR hacia develop o main.
  pull_request:
    branches: [develop, main]
  # Al unir a develop.
  push:
    branches: [develop]
  # Desde Actions → Run workflow.
  workflow_dispatch:

jobs:
  analisis:
    name: Análisis estático
    runs-on: ubuntu-24.04
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7
        with:
          # Todo el historial, para que gitleaks revise también los commits anteriores.
          fetch-depth: 0

      # Seguridad (#97): falla si encuentra claves o contraseñas en el código o en el historial de Git.
      - name: Buscar claves con gitleaks
        id: gitleaks
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest git /repo --redact --verbose

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      # Reglas de flutter_lints (analysis_options.yaml); --fatal-infos hace que hasta los avisos
      # informativos detengan el workflow.
      - name: Analizar con flutter analyze
        id: analyze
        run: flutter analyze --fatal-infos

      # Falla si un PR trae código sin formato (líneas de hasta 160 caracteres).
      - name: Revisar formato con dart format
        id: formato
        if: always() && steps.analyze.outcome != 'skipped'
        run: dart format --output=none --set-exit-if-changed --line-length 160 lib test integration_test

      # Solo informa: lista las dependencias con versión nueva (la revisión de vulnerabilidades la
      # hace Dependabot, ver .github/dependabot.yml).
      - name: Revisar dependencias desactualizadas
        if: always() && steps.analyze.outcome != 'skipped'
        run: flutter pub outdated --no-dev-dependencies | tee dependencias.txt

      # Resumen visible en la página de la corrida, con el resultado real de cada revisión.
      - name: Resumen
        if: always()
        env:
          GITLEAKS: ${{ steps.gitleaks.outcome }}
          ANALYZE: ${{ steps.analyze.outcome }}
          FORMATO: ${{ steps.formato.outcome }}
        run: |
          estado() { case "$1" in success) echo "pasó";; failure) echo "**falló**";; *) echo "no se ejecutó";; esac; }
          echo "## Análisis de código estático" >> $GITHUB_STEP_SUMMARY
          echo "- gitleaks (claves en el código y el historial): $(estado "$GITLEAKS")" >> $GITHUB_STEP_SUMMARY
          echo "- flutter analyze: $(estado "$ANALYZE")" >> $GITHUB_STEP_SUMMARY
          echo "- dart format: $(estado "$FORMATO")" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat dependencias.txt >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "Sin reporte de dependencias" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
