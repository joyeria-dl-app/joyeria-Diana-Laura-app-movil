# PRUEBAS DE REGRESIÓN: toda la suite antes de publicar una versión y cada semana.
name: Pruebas de regresión

on:
  push:
    branches: [main]
    tags: ['v*']
  schedule:
    - cron: '0 14 * * 1' # lunes 8:00 (hora de México)
  workflow_dispatch:

jobs:
  unitarias:
    name: Regresión - pruebas unitarias
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Ejecutar todas las pruebas unitarias
        run: flutter test --reporter expanded

      # Las pruebas de la versión anterior (último tag) se corren contra el código actual:
      # ninguna prueba que pasaba antes debe fallar.
      - name: Ejecutar las pruebas de la versión anterior
        run: |
          git fetch --tags --quiet
          anterior=$(git describe --tags --abbrev=0)
          echo "Versión anterior: $anterior"
          mkdir -p .regresion_anterior
          for f in $(git ls-tree --name-only -r "$anterior" -- test); do git show "$anterior:$f" > ".regresion_anterior/$(basename "$f")"; done
          flutter test .regresion_anterior --reporter expanded

  integracion:
    name: Regresión - pruebas de integración
    needs: unitarias
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Instalar Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # La clave de Firebase y la cuenta de prueba vienen de los secretos del repositorio.
      - name: Preparar la configuración de la app
        run: echo '{"FIREBASE_API_KEY":"${{ secrets.FIREBASE_API_KEY }}","PRUEBAS_CORREO":"${{ secrets.PRUEBAS_CORREO }}","PRUEBAS_CONTRASENA":"${{ secrets.PRUEBAS_CONTRASENA }}"}' > env.json

      # Permite al emulador usar la aceleración por hardware del runner.
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Ejecutar pruebas de integración en el emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: flutter test integration_test/catalogo_test.dart integration_test/recorrido_cliente_test.dart integration_test/aceptacion_test.dart --dart-define-from-file=env.json --reporter expanded
