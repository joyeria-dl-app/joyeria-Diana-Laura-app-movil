# PRUEBAS DE REGRESIÓN
# Tipo: regresión · Alcance: toda la app (HU-01 a la última HU integrada).
# Comprueba que lo que ya funcionaba sigue funcionando: corre todas las pruebas unitarias
# actuales, las pruebas de la versión anterior contra el código nuevo y las pruebas en el
# emulador de integración y aceptación.
#
# Ejecución: los dos trabajos van EN SECUENCIA (integración espera a que pasen las unitarias,
# `needs: unitarias`); si las unitarias fallan, no se gasta tiempo en el emulador. Este
# workflow corre EN PARALELO con los demás workflows del repositorio.
#
# Acción según el resultado: Publicar APK llama a este workflow y solo compila la versión si
# pasa. Si falla una corrida programada o en main, "Avisar fallas" abre una issue.
name: Pruebas de regresión

on:
  # Al unir a main (antes de publicar) y al crear una etiqueta de versión.
  push:
    branches: [main]
    tags: ['v*']
  # Cada lunes a las 8:00 (hora de México) sobre develop, para detectar fallas a tiempo.
  schedule:
    - cron: '0 14 * * 1'
  # Desde Actions → Run workflow.
  workflow_dispatch:
  # Lo llama Publicar APK antes de compilar una versión.
  workflow_call:
    secrets:
      FIREBASE_API_KEY:
        required: true
      PRUEBAS_CORREO:
        required: true
      PRUEBAS_CONTRASENA:
        required: true
      GOOGLE_SERVICES_JSON:
        required: true

jobs:
  unitarias:
    name: Regresión - pruebas unitarias
    runs-on: ubuntu-24.04
    steps:
      # fetch-depth: 0 descarga todo el historial y las etiquetas para encontrar la versión anterior.
      - name: Descargar el código
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Misma versión de Flutter en todos los workflows para que los resultados sean comparables.
      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      # google-services.json (Firebase Cloud Messaging, #55) no se sube al repositorio porque el
      # repositorio es público; Gradle lo necesita para compilar y aquí se crea desde un secreto.
      - name: Crear google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      # Todas las pruebas unitarias y de widgets del código actual.
      - name: Ejecutar todas las pruebas unitarias
        run: flutter test --reporter expanded --file-reporter json:resultados/regresion-unitarias.json

      # Las pruebas de la versión anterior se corren contra el código actual: ninguna prueba que
      # pasaba antes debe fallar. La versión anterior es la etiqueta v* más alta del repositorio,
      # sin contar la que se está publicando. Antes se usaba `git describe`, que solo ve las
      # etiquetas de la rama actual y fallaba en develop porque las versiones se etiquetan en main
      # (run 38314303514, #206).
      - name: Ejecutar las pruebas de la versión anterior
        run: |
          anterior=$(git tag --list 'v*' --sort=-v:refname | grep -vx "${GITHUB_REF_NAME}" | head -1)
          if [ -z "$anterior" ]; then
            echo "No hay una versión anterior publicada; se omite este paso."
            exit 0
          fi
          echo "Versión anterior: $anterior"
          mkdir -p .regresion_anterior
          for f in $(git ls-tree --name-only -r "$anterior" -- test); do git show "$anterior:$f" > ".regresion_anterior/$(basename "$f")"; done
          flutter test .regresion_anterior --reporter expanded --file-reporter json:resultados/regresion-version-anterior.json

      # Resultados de la suite actual y de la versión anterior, descargables desde la corrida (#230).
      - name: Guardar evidencia
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: regresion-unitarias
          path: resultados/
          if-no-files-found: ignore

  integracion:
    name: Regresión - pruebas de integración
    # Una sola corrida a la vez por cuenta de prueba (PRUEBAS_CORREO), en todo el repositorio (#238): si otra
    # corrida ya la usa, esta espera a que termine en lugar de cambiarle el carrito a la mitad.
    concurrency:
      group: cuenta-pruebas
      cancel-in-progress: false
    # Solo corre si las unitarias pasaron.
    needs: unitarias
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      # google-services.json (Firebase Cloud Messaging, #55) no se sube al repositorio porque el
      # repositorio es público; Gradle lo necesita para compilar y aquí se crea desde un secreto.
      - name: Crear google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      # El emulador de Android necesita Java 17 para compilar la app.
      - name: Instalar Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # La clave de Firebase y la cuenta de prueba vienen de los secretos del repositorio; el
      # archivo env.json solo existe durante la corrida y nunca se sube al repositorio.
      - name: Preparar la configuración de la app
        run: echo '{"FIREBASE_API_KEY":"${{ secrets.FIREBASE_API_KEY }}","PRUEBAS_CORREO":"${{ secrets.PRUEBAS_CORREO }}","PRUEBAS_CONTRASENA":"${{ secrets.PRUEBAS_CONTRASENA }}"}' > env.json

      # Permite al emulador usar la aceleración por hardware del runner.
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Las pruebas del emulador corren EN SECUENCIA dentro del mismo emulador, una después de
      # otra, con la cuenta de prueba de integración.
      - name: Ejecutar pruebas de integración en el emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: flutter test integration_test/catalogo_test.dart integration_test/recorrido_cliente_test.dart integration_test/aceptacion_test.dart integration_test/aceptacion_pedidos_test.dart --dart-define-from-file=env.json --reporter expanded --file-reporter json:resultados/regresion-integracion.json

      # Resultados de la regresión en el emulador, descargables desde la corrida (#230).
      - name: Guardar evidencia
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: regresion-integracion
          path: resultados/
          if-no-files-found: ignore
