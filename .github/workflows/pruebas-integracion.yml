# PRUEBAS DE INTEGRACIÓN
# Tipo: integración · Alcance: recorridos completos de la app real contra el backend de Render
# (HU-07 a HU-10: catálogo, filtro, detalle, carrito y favoritos con sesión).
# El recorrido que une carrito, pedido, pago y personalización (Sprint 3, #146) se corre a mano
# porque necesita un pago en Mercado Pago (ver pruebas/integracion_sprint3.md).
#
# Ejecución: los pasos van EN SECUENCIA y las pruebas corren EN SECUENCIA dentro del mismo
# emulador. Este workflow corre EN PARALELO con Aceptación, Entorno y Rendimiento; cada uno usa
# su propia cuenta de prueba para no cambiarse el carrito entre ellos (#185).
#
# Acción según el resultado: en develop, si falla, "Avisar fallas" abre una issue; en el PR de
# develop a main es un check obligatorio y bloquea el paso a main.
name: Pruebas de integración

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  integracion:
    name: Integración en emulador Android
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      # Descarga el código del commit que disparó el workflow.
      - name: Descargar el código
        uses: actions/checkout@v7

      # Misma versión de Flutter en todos los workflows para que los resultados sean comparables.
      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      # Librerías de pubspec.yaml.
      - name: Instalar dependencias
        run: flutter pub get

      # El emulador y la compilación de Android necesitan Java 17.
      - name: Instalar Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # Permite al emulador usar la aceleración por hardware del runner.
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # La clave de Firebase y la cuenta de cliente de prueba vienen de los secretos del repositorio.
      - name: Preparar la configuración de la app
        run: echo '{"FIREBASE_API_KEY":"${{ secrets.FIREBASE_API_KEY }}","PRUEBAS_CORREO":"${{ secrets.PRUEBAS_CORREO }}","PRUEBAS_CONTRASENA":"${{ secrets.PRUEBAS_CONTRASENA }}"}' > env.json

      # Levanta un Pixel 6 con Android 14 (API 34) sin animaciones y corre las pruebas en él.
      - name: Ejecutar pruebas de integración en el emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: flutter test integration_test/catalogo_test.dart integration_test/recorrido_cliente_test.dart --dart-define-from-file=env.json --reporter expanded
